[project]
name = "kpp-docx-worker"
version = "0.1.0"
description = "Versioned local DOCX worker for the KPP proposal compiler"
requires-python = ">=3.11,<3.15"
dependencies = [
  "lxml==6.1.1",
  "pydantic==2.13.4",
  "python-docx==1.2.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kpp_docx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
